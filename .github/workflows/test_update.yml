name: Test Feed Update  # اسم الـ Action

on:
  schedule:
    - cron: '*/1 * * * *'  # متى يشتغل (كل دقيقة للتجربة)
  workflow_dispatch:      # يسمح بالتشغيل اليدوي

jobs:
  build:
    runs-on: ubuntu-latest  # السيرفر اللي هيشتغل عليه

    steps:
    - uses: actions/checkout@v3  # ينسخ Repo على السيرفر

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'  # يجهز Python

    - name: Run Fake Script
      run: python fake_youtube_api.py  # يشغل السكريبت

    - name: Commit & Push feed.json
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "actions@github.com"
        git add feed.json
        git commit -m "Update feed.json - test"
        git push
      continue-on-error: true
