name: Update Massary TV Feed

on:
  schedule:
    - cron: "0 */6 * * *"  # كل 6 ساعات UTC
  workflow_dispatch:        # لتشغيل يدوي

jobs:
  update_feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests isodate

      - name: Run YouTube feed script
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python youtube_api.py

      - name: Commit updated feed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add feed_1.json
          git commit -m "Update feed_1.json automatically"
          git push
        continue-on-error: true
