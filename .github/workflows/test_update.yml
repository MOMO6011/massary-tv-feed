name: Test Feed Update

on:
  schedule:
    - cron: '*/5 * * * *'  # كل 5 دقائق للتجربة
  workflow_dispatch:      # لتشغيل يدوي من GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Run Fake Script
      run: python fake_youtube_api.py

    - name: Commit & Push feed.json
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "actions@github.com"
        git add feed.json
        git diff --cached --quiet || git commit -m "Update feed.json - test"
        git push
